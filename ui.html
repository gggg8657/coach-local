<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글쓰기 코치</title>
<style>
  :root{--bg:#f6f7f9;--fg:#1d1f23;--muted:#6b7280;--line:#dde1e6;--card:#fff;--acc:#2563eb;--acc2:#e8efff;--del:#fde2e2;--delf:#b42318;--ins:#dcfce7;--insf:#166534}
  *{box-sizing:border-box}
  body{font:14.5px/1.6 -apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0}
  [hidden]{display:none!important}
  .wrap{max-width:1360px;margin:0 auto;padding:18px 16px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:20px;margin:0}h1 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
  .priv{font-size:12px;color:#166534;background:#ecfdf3;border:1px solid #c6f0d5;border-radius:99px;padding:2px 10px}
  .hint{font-size:12px;color:var(--muted)}
  input,select,textarea,button{font:inherit;font-size:14px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--fg)}
  button{cursor:pointer;white-space:nowrap}button:hover{border-color:#b8c0cc}button:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
  button.sm{font-size:12.5px;padding:3px 9px}button.link{border:none;background:none;color:var(--acc);padding:2px 4px}
  .bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .bar .grow{flex:1 1 260px;min-width:0}
  .bar label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
  @media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
  /* 편집기: 투명 textarea 아래에 같은 글자를 그린 배경 층(밑줄·색)을 깐다 */
  .ed{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px}
  .ed:focus-within{border-color:#9db7f5;box-shadow:0 0 0 3px #e8efff}
  .ed .bd,.ed textarea{font:16px/1.85 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding:22px 26px;margin:0;border:0;
    white-space:pre-wrap;overflow-wrap:break-word;word-break:keep-all;letter-spacing:0;tab-size:4}
  .ed .bd{color:transparent;min-height:440px;pointer-events:none}
  .ed textarea{position:absolute;inset:0;width:100%;height:100%;background:transparent;resize:none;overflow:hidden;outline:none;border-radius:10px;color:var(--fg);caret-color:var(--fg)}
  .ed textarea::placeholder{color:#a0a6b0}
  mark{color:transparent;border-radius:3px;border-bottom:2px solid;padding:0}
  mark.on{outline:2px solid currentColor}
  .stat{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:8px 2px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#16a34a;margin-right:5px}.dot.busy{background:#f59e0b;animation:bl 1s infinite}.dot.err{background:#dc2626}
  @keyframes bl{50%{opacity:.3}}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px -4px 10px}
  .tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 10px;color:var(--muted);font-weight:600}
  .tabs button.on{color:var(--fg);border-bottom-color:var(--acc)}
  .catrow{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0}
  .catrow .n{flex:1;min-width:0}.catrow b{font-weight:600}
  .chip{display:inline-block;font-size:11.5px;border-radius:5px;padding:0 7px;font-weight:600;white-space:nowrap}
  .cards{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:calc(100vh - 300px);overflow:auto;padding-right:2px}
  .card{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;font-size:13.5px;cursor:pointer;overflow-wrap:anywhere}
  .card:hover,.card.on{border-color:var(--acc);box-shadow:0 1px 6px #2563eb22}
  .card .ch{display:flex;align-items:center;gap:6px;margin-bottom:3px}.card .ch .sp{flex:1}
  .card .why{color:var(--muted);font-size:12.5px;margin-top:2px}
  del{background:var(--del);color:var(--delf);text-decoration:line-through;border-radius:3px;padding:0 2px}
  ins{background:var(--ins);color:var(--insf);text-decoration:none;border-radius:3px;padding:0 2px}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:13px}
  .pop{position:absolute;z-index:5;width:min(340px,90%);background:#fff;border:1px solid #c8d3e6;border-radius:10px;box-shadow:0 6px 24px #0f172a26;padding:10px 12px;font-size:13.5px;overflow-wrap:anywhere}
  .pop .bt{display:flex;gap:6px;margin-top:8px}
  .issue{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:8px 0;font-size:13.5px;overflow-wrap:anywhere}
  .issue q{display:block;color:var(--muted);font-size:12.5px;cursor:pointer}.issue q:hover{color:var(--acc)}
  .modal{position:fixed;inset:0;background:#0f172a55;display:flex;align-items:flex-start;justify-content:center;z-index:20;padding:40px 12px;overflow:auto}
  .modal>.box{background:#fff;border-radius:12px;width:min(920px,100%);padding:16px 18px;box-shadow:0 10px 40px #0003}
  .modal h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}.modal h3 .sp{flex:1}
  .pm{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px}@media (max-width:700px){.pm{grid-template-columns:minmax(0,1fr)}}
  .plist{display:flex;flex-direction:column;gap:3px;max-height:520px;overflow:auto}
  .plist button{text-align:left;border-color:transparent;display:flex;justify-content:space-between;gap:6px}.plist button.on{background:var(--acc2);border-color:var(--acc)}
  .pf label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
  .pf input,.pf textarea{width:100%}.pf textarea{resize:vertical;min-height:70px;line-height:1.5}
  .pf .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media (max-width:700px){.pf .row{grid-template-columns:1fr}}
  table.docs{width:100%;border-collapse:collapse;font-size:13.5px}table.docs td{border-bottom:1px solid #eef0f3;padding:6px 4px;vertical-align:top}
  table.docs td.t{cursor:pointer;overflow-wrap:anywhere}table.docs td.t:hover{color:var(--acc)}
  details.menu{position:relative;display:inline-block}details.menu summary{list-style:none;cursor:pointer;font-size:14px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
  details.menu summary::-webkit-details-marker{display:none}
  details.menu>div{position:absolute;right:0;top:110%;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px #0002;z-index:6;display:flex;flex-direction:column;min-width:150px;padding:4px}
  details.menu>div button{border:none;text-align:left}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:7px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
  .toast.on{opacity:.95}
  .kindbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff8e6;border:1px solid #f3d99b;color:#7a5200;border-radius:9px;padding:7px 12px;margin-bottom:8px;font-size:13.5px}
  .kindbar span{flex:1;min-width:0}
  .prof{border:1px solid #e3e7ee;border-radius:9px;padding:7px 10px;margin:-4px -4px 10px;background:#fafbfd;font-size:13px}
  .prof summary{cursor:pointer;overflow-wrap:anywhere}.prof[open] summary{margin-bottom:8px}
  .prow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:6px;align-items:start;margin:5px 0;overflow-wrap:anywhere}.prow>b{font-weight:600;color:#475569;font-size:12.5px;padding-top:2px}
  .prow select,.prow input{font-size:13px;padding:3px 7px}
  .pchip{display:inline-block;background:#eef2f7;border-radius:5px;padding:0 7px;margin:0 4px 4px 0;font-size:12.5px}.pchip.warn{background:#fff1d6;color:#8a5a00}
  .pchip [data-term]{cursor:pointer}.noteo{background:#f3f4f6;border-radius:3px;padding:0 3px}
  .vers li{list-style:none;display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}.vers{padding:0;margin:0}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>글쓰기 코치 <small>쓰는 동안 글 종류·목적에 맞춰 고칠 곳을 짚어 줍니다</small></h1>
  <span class="priv" title="글은 이 서버의 로컬 LLM 으로만 처리하며 외부로 보내지 않습니다. 문서·페르소나는 사용자별로 따로 저장됩니다.">🔒 로컬 LLM · 외부 전송 없음</span>
  <span class="hint" id="modelinfo"></span>
</header>

<div class="bar">
  <label>글 종류 <select id="persona"></select></label>
  <button id="pmgr" title="페르소나 보기·만들기·고치기">페르소나 관리</button>
  <input id="purpose" class="grow" placeholder="목적 한 줄 — 예) 부서장에게 고속 카메라 구매 승인 요청">
</div>
<div class="bar">
  <input id="title" class="grow" placeholder="제목 (비우면 첫 줄)" style="flex-basis:200px">
  <button id="new">새 글</button>
  <button id="docsbtn">문서함</button>
  <button id="importbtn">불러오기</button><input type="file" id="file" hidden>
  <button id="save">저장</button>
  <details class="menu" id="exp"><summary>내보내기 ▾</summary><div>
    <button data-x="txt">텍스트 (.txt)</button><button data-x="md">마크다운 (.md)</button><button data-x="docx">워드 (.docx)</button></div></details>
  <button id="copy">복사</button>
  <button id="reviewbtn" class="primary">전체 검토</button>
</div>

<div class="cols">
  <div>
    <div class="kindbar" id="kindbar" hidden></div>
    <div class="ed" id="ed">
      <div class="bd" id="bd"></div>
      <textarea id="ta" spellcheck="false" placeholder="여기에 글을 쓰세요. 잠깐 멈추면(약 1초) 바뀐 문단만 다시 읽고 고칠 곳을 표시합니다.&#10;&#10;밑줄 친 곳을 누르면 제안이 뜹니다."></textarea>
      <div class="pop" id="pop" hidden></div>
    </div>
    <div class="stat">
      <span><span class="dot" id="dot"></span><span id="st">준비</span></span>
      <span id="lat"></span><span id="cnt"></span><span id="saved"></span>
      <span style="flex:1"></span>
      <button class="sm" id="undo" title="되돌리기 (Ctrl+Z)">↶ 되돌리기</button>
      <button class="sm" id="recheck" title="모든 문단을 다시 검사">다시 검사</button>
      <label class="hint">모델 <select id="model" style="font-size:12.5px;padding:2px 6px"></select></label>
    </div>
  </div>

  <div class="panel" id="side">
    <details class="prof" id="prof"><summary><b>글 파악</b> <span class="hint" id="profsum">글을 쓰면 문체·용어·요청을 파악합니다</span></summary>
      <div class="prow"><b>문체</b><div><select id="pf-style"><option value="">자동</option><option>개조식</option><option>합니다체</option><option>해요체</option><option>~다체</option></select>
        <span class="hint">정하면 그 종결로 맞춤</span></div></div>
      <div class="prow"><b>고정 표기</b><div><input id="pf-terms" placeholder="쉼표로 — 예) 고속 카메라, 시험동" style="width:100%"></div></div>
      <div id="pf-dyn"></div>
      <div class="hint" style="display:flex;gap:6px;align-items:center;margin-top:6px"><span id="pf-when" style="flex:1"></span><button class="sm" id="pf-re">다시 파악</button></div>
    </details>
    <div class="tabs" id="stabs"><button data-t="sug" class="on">제안 <span id="nsug"></span></button><button data-t="rev">전체 검토</button><button data-t="ver">판 기록</button></div>
    <div id="t-sug">
      <div id="cats"></div>
      <div class="cards" id="cards"></div>
    </div>
    <div id="t-rev" hidden><div class="empty">위의 <b>전체 검토</b>를 누르면 구조·흐름·빠진 요소를 짚어 줍니다.</div></div>
    <div id="t-ver" hidden></div>
  </div>
</div>
</div>

<div class="modal" id="m-persona" hidden><div class="box">
  <h3>페르소나 — 글 종류·형식 코치 <span class="sp"></span><button id="pnew" class="sm">+ 새로 만들기</button><button class="sm" data-close>닫기</button></h3>
  <div class="pm">
    <div class="plist" id="plist"></div>
    <div class="pf">
      <div class="tabs" id="pftabs" style="margin:0 0 10px"><button data-t="form" class="on">양식</button><button data-t="json">JSON</button></div>
      <div id="pf-form">
        <div class="row"><label>이름<input id="f-name" maxlength="30"></label><label>대상 독자<input id="f-audience"></label></div>
        <label>어조<input id="f-tone"></label>
        <div class="row"><label>형식 규칙 (한 줄에 하나)<textarea id="f-rules" rows="6"></textarea></label><label>금지·주의 (한 줄에 하나)<textarea id="f-avoid" rows="6"></textarea></label></div>
        <label>예시 글<textarea id="f-example" rows="4"></textarea></label>
      </div>
      <div id="pf-json" hidden><textarea id="f-json" rows="18" style="width:100%;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace"></textarea></div>
      <div class="bar"><button id="psave" class="primary">저장</button><button id="pdup">복제</button><button id="pdel">삭제</button><button id="puse">이 페르소나로 쓰기</button><span class="hint" id="pmsg"></span></div>
    </div>
  </div>
</div></div>

<div class="modal" id="m-docs" hidden><div class="box">
  <h3>문서함 <span class="hint">이 접속자의 문서만 보입니다</span><span class="sp"></span><button class="sm" data-close>닫기</button></h3>
  <table class="docs" id="doclist"></table>
</div></div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const MODEL_DEFAULT = %MODEL%, CATS = %CATS%;
const COL = { 맞춤법: ['#dc2626', '#fde8e8'], 문체: ['#7c3aed', '#efe7ff'], 형식: ['#2563eb', '#e3edff'], 명료: ['#b45309', '#fff0d1'], 논리: ['#0f766e', '#d6f5ee'], 사실: ['#be185d', '#fde7f1'] };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const chip = c => `<span class="chip" style="color:${COL[c][0]};background:${COL[c][1]}">${CATS[c]}</span>`;
const ls = { get: k => { try { return localStorage.getItem('coach.' + k) } catch (e) { return null } }, set: (k, v) => { try { localStorage.setItem('coach.' + k, v) } catch (e) { } } };
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 1800); }
async function api(p, body) {
  const r = await fetch('api/' + p, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json(); if (j.error) throw new Error(j.error); return j;
}

// ── 상태 ────────────────────────────────────────────────────────────────
const ta = $('ta'), bd = $('bd');
let PERSONAS = [], persona = null, doc = { id: '', versions: 0 };
// 같은 문단은 다시 묻지 않음(되돌리면 제안도 돌아옴). 맞춤법은 문단 글자만으로, 문체·형식은 문단 + 바로 앞 문단으로 기억한다
// → 앞 문단을 고치면 다음 문단의 문체·형식(접속어·반복 등)도 다시 본다.
const spellC = new Map(), styleC = new Map();
let RULES = [];                 // 규칙 검사(용어·약어·지시어·날짜·합계·되풀이·문체 섞임) — LLM 없이, 글이 바뀔 때마다 새로
const PASSES = ['spell', 'style'];   // 맞춤법(작고 빠름) 먼저, 문체·형식은 다음
const prevOf = (L, i) => { for (let j = i - 1; j >= 0; j--) if (L[j].trim()) return L[j]; return ''; };
const skey = (L, i) => L[i] + '\u0002' + prevOf(L, i);
const lineSugs = (L, i) => [...(spellC.get(L[i]) || []), ...(styleC.get(skey(L, i)) || []), ...RULES.filter(r => r.i === i && r.line === L[i])];
const allChecked = () => { const L = lines(); return L.every((l, i) => l.trim().length < 2 || spellC.has(l) && styleC.has(skey(L, i))); };
function clearCaches() { spellC.clear(); styleC.clear(); RULES = []; }
const ignored = new Set();      // 무시한 제안 (원문\u0001제안)
const inflight = new Map();     // 요청 id → {keys:Set, ctrl, pass, n}
let SUGS = [], active = null, timer = null, lastInput = 0, lats = [];

// ── 문단 → 제안 위치 계산 · 배경 층 그리기 ────────────────────────────────
function lines() { return ta.value.split('\n'); }
function compute() {
  const out = []; let off = 0;
  const L = lines();
  L.forEach((ln, i) => {
    const taken = [];
    // 겹치면 규칙 검사의 수정 → 맞춤법 → 짧은 쪽만 밑줄. 문체·논리의 문장 다시 쓰기와 규칙 검사의 메모는 카드로 남김
    const rank = s => s.src === 'rule' && s.o !== s.n ? 0 : s.c === '맞춤법' ? 1 : s.o !== s.n ? 2 : 3;
    for (const s of lineSugs(L, i).sort((a, b) => rank(a) - rank(b) || a.o.length - b.o.length)) {
      if (ignored.has(s.o + '\u0001' + s.n) || out.some(x => x.line === i && x.o === s.o && x.n === s.n)) continue;
      const at = ln.substr(s.at, s.o.length) === s.o ? s.at : ln.indexOf(s.o);
      if (at < 0) continue;
      const nomark = taken.some(([a, b]) => at < b && at + s.o.length > a);
      if (nomark && !((s.c === '문체' || s.c === '논리') && s.o.length >= 15 || s.src === 'rule')) continue;
      if (!nomark) taken.push([at, at + s.o.length]);
      out.push({ ...s, nomark, line: i, start: off + at, end: off + at + s.o.length, k: `${s.c}|${s.o}|${s.n}|${off + at}` });
    }
    off += ln.length + 1;
  });
  return out.sort((a, b) => a.start - b.start);
}
function render() {
  SUGS = compute();
  const t = ta.value; let h = '', p = 0;
  for (const s of SUGS.filter(s => !s.nomark)) {
    h += esc(t.slice(p, s.start)) + `<mark data-k="${esc(s.k)}" class="${active === s.k ? 'on' : ''}" style="background:${COL[s.c][1]};border-color:${COL[s.c][0]};color:transparent;outline-color:${COL[s.c][0]}">${esc(t.slice(s.start, s.end))}</mark>`;
    p = s.end;
  }
  bd.innerHTML = h + esc(t.slice(p)) + '\n​';
  $('nsug').textContent = SUGS.length || '';
  $('cnt').textContent = `${t.replace(/\s/g, '').length.toLocaleString()}자`;
  // 분류별 요약 + 카드
  const by = {}; SUGS.forEach(s => (by[s.c] = by[s.c] || []).push(s));
  $('cats').innerHTML = Object.keys(CATS).filter(c => by[c]).map(c => `<div class="catrow">${chip(c)}<span class="n"><b>${by[c].length}</b>건</span>`
    + (by[c].every(s => s.o === s.n) ? '' : `<button class="sm" data-all="${c}">모두 적용</button>`) + `<button class="sm" data-none="${c}">모두 무시</button></div>`).join('');

let ptimer; $('purpose').oninput = () => { ls.set('purpose', $('purpose').value); clearTimeout(ptimer); ptimer = setTimeout(() => { resetChecks(); autosave(); }, 1500); };

let pedit = null;
const pform = p => { $('f-name').value = p.name || ''; $('f-audience').value = p.audience || ''; $('f-tone').value = p.tone || ''; $('f-rules').value = (p.rules || []).join('\n'); $('f-avoid').value = (p.avoid || []).join('\n'); $('f-example').value = p.example || ''; $('f-json').value = JSON.stringify(strip(p), null, 1); };
const strip = p => ({ name: p.name, audience: p.audience, tone: p.tone, rules: p.rules, avoid: p.avoid, example: p.example });
const fromForm = () => $('pf-json').hidden ? { name: $('f-name').value, audience: $('f-audience').value, tone: $('f-tone').value, rules: $('f-rules').value.split('\n'), avoid: $('f-avoid').value.split('\n'), example: $('f-example').value } : JSON.parse($('f-json').value);
function plist() {
  $('plist').innerHTML = PERSONAS.map(p => `<button data-id="${p.id}" class="${pedit && pedit.id === p.id ? 'on' : ''}"><span>${esc(p.name)}</span><span class="hint">${p.builtin ? '기본' : '내 것'}</span></button>`).join('')
    + (pedit && !pedit.id ? `<button class="on"><span>${esc(pedit.name || '(새 페르소나)')}</span><span class="hint">새로</span></button>` : '');
}
function pselect(p) {
  pedit = p; plist(); pform(p);
  const ro = !!p.builtin;
  document.querySelectorAll('.pf input,.pf textarea').forEach(x => x.readOnly = ro);
  $('psave').hidden = ro; $('pdel').hidden = ro || !p.id; $('puse').hidden = !p.id;
  $('pmsg').textContent = ro ? '기본 페르소나는 고칠 수 없습니다 — 복제해서 내 것으로 만드세요.' : '';
}
$('pmgr').onclick = () => { $('m-persona').hidden = false; pselect(persona); };
$('plist').onclick = e => { const b = e.target.closest('button[data-id]'); if (b) pselect(PERSONAS.find(p => p.id === b.dataset.id)); };
$('pnew').onclick = () => pselect({ id: '', name: '', audience: '', tone: '', rules: [], avoid: [], example: '' });
$('pdup').onclick = () => { let p; try { p = fromForm(); } catch (e) { return $('pmsg').textContent = 'JSON 오류: ' + e.message; } pselect({ ...p, id: '', builtin: false, name: (p.name || '') + ' (사본)' }); $('pmsg').textContent = '사본입니다 — 고친 뒤 저장하세요.'; };
$('psave').onclick = async () => {
  try { const p = await api('personas', { ...fromForm(), id: pedit.id }); await loadPersonas($('persona').value); pselect(PERSONAS.find(x => x.id === p.id)); $('pmsg').textContent = '저장했습니다'; if (persona.id === p.id) { persona = p; resetChecks(); } }
  catch (e) { $('pmsg').textContent = '오류: ' + e.message; }
};
$('pdel').onclick = async () => { if (!pedit.id || !confirm(`'${pedit.name}' 페르소나를 지울까요?`)) return; await api('personas/delete', { id: pedit.id }); await loadPersonas(); pselect(persona); };
$('puse').onclick = () => { $('persona').value = pedit.id; $('persona').onchange(); $('m-persona').hidden = true; };
$('pftabs').onclick = e => {
  const t = e.target.dataset.t; if (!t) return;
  try { if (t === 'json') $('f-json').value = JSON.stringify(strip(fromForm()), null, 1); else pform({ ...pedit, ...JSON.parse($('f-json').value) }); }
  catch (er) { return $('pmsg').textContent = 'JSON 오류: ' + er.message; }
  $('pftabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); $('pf-form').hidden = t !== 'form'; $('pf-json').hidden = t !== 'json';
};
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('.modal').hidden = true);
document.querySelectorAll('.modal').forEach(m => m.onclick = e => { if (e.target === m) m.hidden = true; });

// ── 문서: 자동 저장 · 문서함 · 판 기록 ─────────────────────────────────────
let stimer;
function autosave(snapshot) {
  clearTimeout(stimer);
  if (!ta.value.trim()) return;
  stimer = setTimeout(async () => {
    try {
      const j = await api('docs', { id: doc.id, title: $('title').value, text: ta.value, persona: persona && persona.id, purpose: $('purpose').value, profile_user: USERP, snapshot: !!snapshot });
      doc = j; ls.set('doc', j.id); $('saved').textContent = `저장됨 ${j.updated.slice(11, 16)}`;
      if (snapshot) toast(`저장했습니다 (판 ${j.versions})`);
      if (!$('t-ver').hidden) versions();
    } catch (e) { $('saved').textContent = '저장 실패: ' + e.message; }
  }, snapshot ? 0 : 3000);
}
$('title').oninput = () => autosave();
$('save').onclick = () => { if (!ta.value.trim()) return toast('저장할 글이 없습니다'); autosave(true); };
function clearReview() { $('t-rev').innerHTML = '<div class="empty">위의 <b>전체 검토</b>를 누르면 구조·흐름·빠진 요소를 짚어 줍니다.</div>'; tab('sug'); }
function setText(t) { clearReview(); ta.value = t; active = null; $('pop').hidden = true; render(); schedule(300); }
async function openDoc(id) {
  const j = await api('docs/' + id);
  doc = { id: j.id, versions: (j.versions || []).length }; ls.set('doc', j.id);
  $('title').value = j.title || ''; $('purpose').value = j.purpose || '';
  if (j.persona && PERSONAS.some(p => p.id === j.persona)) { $('persona').value = j.persona; persona = PERSONAS.find(p => p.id === j.persona); }
  clearCaches(); setUserProf(j.profile_user); PROF.llm = null; PROF.llmText = null; setText(j.text || ''); setTimeout(() => maybeProfile(true), 2500); $('saved').textContent = `불러옴 ${j.updated.slice(5, 16).replace('T', ' ')}`;
  return j;
}
$('new').onclick = () => { doc = { id: '', versions: 0 }; ls.set('doc', ''); $('title').value = ''; setUserProf(null); PROF.llm = null; PROF.llmText = null; PROF.llmAt = 0; PROF.heur = null; setText(''); $('saved').textContent = ''; ta.focus(); };
$('docsbtn').onclick = async () => {
  const ds = await api('docs');
  $('doclist').innerHTML = ds.length ? '<tr class="hint"><td>제목</td><td>종류</td><td>고친 때</td><td>글자</td><td></td></tr>' + ds.map(d => `<tr><td class="t" data-id="${d.id}">${esc(d.title)}</td><td>${esc((PERSONAS.find(p => p.id === d.persona) || {}).name || '')}</td><td class="hint">${d.updated.slice(0, 16).replace('T', ' ')}</td><td class="hint">${d.chars}</td><td><button class="sm" data-del="${d.id}">삭제</button></td></tr>`).join('')
    : '<tr><td class="empty">저장한 문서가 없습니다. 글을 쓰면 3초 뒤 자동 저장됩니다.</td></tr>';
  $('m-docs').hidden = false;
};
$('doclist').onclick = async e => {
  if (e.target.dataset.id) { await openDoc(e.target.dataset.id); $('m-docs').hidden = true; }
  if (e.target.dataset.del && confirm('이 문서를 지울까요?')) { await api('docs/delete', { id: e.target.dataset.del }); if (doc.id === e.target.dataset.del) doc = { id: '' }; $('docsbtn').onclick(); }
};
async function versions() {
  if (!doc.id) return $('t-ver').innerHTML = '<div class="empty">아직 저장하지 않은 글입니다.</div>';
  const j = await api('docs/' + doc.id), vs = (j.versions || []).slice().reverse();
  $('t-ver').innerHTML = '<div class="hint">저장 버튼을 누르거나 10분마다 판이 남습니다(최대 30).</div><ul class="vers">' + vs.map((v, i) => `<li><span style="flex:1">${v.ts.slice(5, 16).replace('T', ' ')} · ${v.text.replace(/\s/g, '').length}자</span><button class="sm" data-v="${vs.length - 1 - i}">이 판으로</button></li>`).join('') + '</ul>';
  $('t-ver').querySelectorAll('[data-v]').forEach(b => b.onclick = () => { replaceRange(0, ta.value.length, j.versions[b.dataset.v].text); toast('그 판으로 되돌렸습니다 — Ctrl+Z 로 취소'); });
}
$('stabs').onclick = e => { const t = e.target.closest('button'); if (!t) return; $('stabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === t)); ['sug', 'rev', 'ver'].forEach(x => $('t-' + x).hidden = x !== t.dataset.t); if (t.dataset.t === 'ver') versions(); };
const tab = t => $('stabs').querySelector(`[data-t="${t}"]`).click();

// ── 전체 검토 ────────────────────────────────────────────────────────────
$('reviewbtn').onclick = async () => {
  if (!ta.value.trim()) return toast('검토할 글이 없습니다');
  tab('rev'); $('t-rev').innerHTML = '<div class="empty">글 전체를 읽는 중… (보통 5~15초)</div>'; $('reviewbtn').disabled = true;
  try {
    const j = await api('review', { text: ta.value, persona, purpose: $('purpose').value, model: $('model').value || MODEL_DEFAULT });
    $('t-rev').innerHTML = `<div style="font-size:13.5px"><b>총평</b> ${esc(j.summary)}</div>`
      + (j.good.length ? `<div style="margin-top:8px;font-size:13px;color:#166534">${j.good.map(g => '✓ ' + esc(g)).join('<br>')}</div>` : '')
      + j.issues.map(i => `<div class="issue" style="border-color:${COL[i.c][0]}">${chip(i.c)} <b>${esc(i.t)}</b>${i.q ? `<q title="본문에서 찾기">${esc(i.q)}</q>` : ''}<div style="color:#374151">→ ${esc(i.f)}</div></div>`).join('')
      + `<div class="hint" style="margin-top:8px">${persona.name} 기준 · ${(j.ms / 1000).toFixed(1)}초</div>`;
    if (j.kind && persona.builtin && j.kind !== persona.name) kindHint((PERSONAS.find(p => p.name === j.kind) || {}).id);
    $('t-rev').querySelectorAll('q').forEach(q => q.onclick = () => { const a = ta.value.indexOf(q.textContent); if (a >= 0) { ta.focus(); ta.setSelectionRange(a, a + q.textContent.length); } });
  } catch (e) { $('t-rev').innerHTML = `<div class="empty">오류: ${esc(e.message)}</div>`; }
  $('reviewbtn').disabled = false;
};

// ── 불러오기 · 내보내기 · 복사 ─────────────────────────────────────────────
fetch('api/import_ok').then(r => r.json()).then(j => $('file').accept = '.txt,.md,.docx' + (j.kordoc ? ',.hwp,.hwpx,.pdf' : '')).catch(() => { });
$('importbtn').onclick = () => $('file').click();
$('file').onchange = async () => {
  const f = $('file').files[0]; if (!f) return; $('file').value = '';
  if (ta.value.trim() && !confirm('지금 글을 불러온 글로 바꿀까요? (지금 글은 저장돼 있습니다)')) return;
  toast('불러오는 중…');
  try {
    const b64 = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(f); });
    const j = await api('import', { file_name: f.name, file_b64: b64 });
    doc = { id: '', versions: 0 }; setUserProf(null); PROF.llm = null; PROF.llmText = null; $('title').value = f.name.replace(/\.[^.]+$/, ''); setText(j.text.replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim()); autosave(true);
  } catch (e) { toast('불러오기 실패: ' + e.message); }
};
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
const fname = () => ($('title').value.trim() || ta.value.trim().split('\n')[0].slice(0, 30) || '글').replace(/[\\/:*?"<>|]/g, '_');
$('exp').onclick = async e => {
  const x = e.target.dataset.x; if (!x) return; $('exp').open = false;
  if (x === 'docx') {
    const r = await fetch('api/export', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: $('title').value.trim(), text: ta.value }) });
    return download(await r.blob(), fname() + '.docx');
  }
  const t = x === 'md' && $('title').value.trim() ? `# ${$('title').value.trim()}\n\n${ta.value}` : ta.value;
  download(new Blob([t], { type: 'text/plain;charset=utf-8' }), fname() + '.' + x);
};
$('copy').onclick = () => { navigator.clipboard.writeText(ta.value).then(() => toast('복사했습니다'), () => { ta.select(); document.execCommand('copy'); toast('복사했습니다'); }); };

// ── 시작 ──────────────────────────────────────────────────────────────────
fetch('api/models').then(r => r.json()).then(ms => { $('model').innerHTML = ms.map(m => `<option ${m === MODEL_DEFAULT ? 'selected' : ''}>${esc(m)}</option>`).join(''); $('modelinfo').textContent = MODEL_DEFAULT; })
  .catch(() => { status.err = 'LLM 서버에 연결할 수 없습니다'; status(); });
(async () => {
  await loadPersonas();
  $('purpose').value = ls.get('purpose') || '';
  const last = ls.get('doc');
  if (last) { try { await openDoc(last); } catch (e) { ls.set('doc', ''); } }
  render(); status();
})();
</script>
</body>
</html>
